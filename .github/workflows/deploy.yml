name: Deploy infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Actions environment to deploy
        required: true
        type: choice
        options:
          - development
          - production
      confirm_production:
        description: Type deploy-production to permit a production apply
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Plan and apply Terraform
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Require explicit production confirmation
        if: inputs.environment == 'production'
        env:
          PRODUCTION_CONFIRMATION: ${{ inputs.confirm_production }}
        run: |
          if [ "$PRODUCTION_CONFIRMATION" != "deploy-production" ]; then
            echo "::error::Production deployments require confirm_production=deploy-production."
            exit 1
          fi

      - name: Select environment configuration
        id: config
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "$TARGET_ENVIRONMENT" in
            development)
              echo "tfvars=environments/dev.tfvars" >> "$GITHUB_OUTPUT"
              ;;
            production)
              echo "tfvars=environments/prod.tfvars" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported deployment environment."
              exit 1
              ;;
          esac

      - name: Require environment deployment configuration
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION_VALUE: ${{ vars.AWS_REGION }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_KEY: ${{ vars.TF_STATE_KEY }}
        run: |
          for setting in DEPLOY_ROLE_ARN AWS_REGION_VALUE STATE_BUCKET STATE_KEY; do
            if [ -z "${!setting}" ]; then
              echo "::error::Configure $setting as a variable in the selected GitHub environment."
              exit 1
            fi
          done

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialize remote state
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_KEY: ${{ vars.TF_STATE_KEY }}
          AWS_REGION_VALUE: ${{ vars.AWS_REGION }}
        run: >-
          terraform init -input=false
          -backend-config="bucket=${STATE_BUCKET}"
          -backend-config="key=${STATE_KEY}"
          -backend-config="region=${AWS_REGION_VALUE}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Validate infrastructure
        run: terraform validate

      - name: Plan deployment
        env:
          TFVARS_FILE: ${{ steps.config.outputs.tfvars }}
        run: terraform plan -input=false -out=tfplan -var-file="$TFVARS_FILE"

      - name: Apply reviewed workflow plan
        run: terraform apply -input=false -auto-approve tfplan
